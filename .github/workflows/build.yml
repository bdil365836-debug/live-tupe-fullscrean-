name: Build LiveTube APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q LiveTube-fullscreen-patch.zip -d /tmp/livetube
          cp -a /tmp/livetube/LiveTube-main/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
